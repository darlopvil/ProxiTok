services:
  proxitok_app:
    build: .
    container_name: proxitok_app
    restart: unless-stopped
    environment:
      - APP_URL=https://proxitok.darlopvil-hub.online
      - LATTE_CACHE=/cache
      - API_CACHE=redis
      - REDIS_HOST=proxitok_redis
      - REDIS_PORT=6379
      # carcabot (firmador) vive en el stack ~/tiktok-signer, red compartida:
      - API_CHROMEDRIVER=http://tiktok-signer_app:8080
      - API_DEVICE_ID=5530475707428751215
    volumes:
      - proxitok-cache:/cache
    depends_on:
      proxitok_redis:
        condition: service_started
    networks:
      - nginx-proxy-manager_default
      - proxitok_internal

  proxitok_redis:
    image: redis:7-alpine
    container_name: proxitok_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - proxitok_internal

volumes:
  proxitok-cache:

networks:
  nginx-proxy-manager_default:
    external: true
  proxitok_internal: